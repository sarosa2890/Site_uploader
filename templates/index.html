<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Загрузка файлов</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(to right, #6a11cb, #2575fc);
            color: #fff;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
        }

        h2 {
            font-size: 30px;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .container {
            background: rgba(0, 0, 0, 0.6);
            border-radius: 10px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        input[type="file"] {
            padding: 10px;
            margin: 10px 0;
            width: 100%;
            background: #34495e;
            color: #ecf0f1;
            border: none;
            border-radius: 5px;
            font-size: 16px;
        }

        button {
            padding: 10px 20px;
            background: #1abc9c;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background: #16a085;
        }

        /* Анимация для фона */
        .background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://source.unsplash.com/1920x1080/?nature,water') no-repeat center center fixed;
            background-size: cover;
            filter: blur(10px);
            z-index: -1;
        }

        .form-container {
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: scale(0.8);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .message {
            margin-top: 20px;
            font-size: 18px;
            color: #1abc9c;
        }

        .message.error {
            color: #e74c3c;
        }

        .message a {
            color: #ecf0f1;
            text-decoration: underline;
        }

    </style>
</head>
<body>
    <div class="background"></div>
    <div class="container form-container">
        <h2>Загрузите файл</h2>
        <form action="/upload" method="POST" enctype="multipart/form-data" id="uploadForm">
            <input type="file" name="file" required>
            <br>
            <button type="submit">Загрузить файл</button>
        </form>

        <!-- Сообщение о загрузке -->
        <div class="message" id="message"></div>
    </div>

    <script>
        const form = document.getElementById('uploadForm');
        const messageDiv = document.getElementById('message');

        form.onsubmit = async (e) => {
            e.preventDefault();
            const formData = new FormData(form);
            const response = await fetch('/upload', {
                method: 'POST',
                body: formData
            });

            const data = await response.json();
            if (response.ok) {
                messageDiv.innerHTML = `Файл успешно загружен! <br><a href="${data.file_url}" target="_blank">Скачать файл</a>`;
                messageDiv.classList.remove('error');
                messageDiv.classList.add('message');
            } else {
                messageDiv.innerHTML = `Ошибка: ${data.error}`;
                messageDiv.classList.add('error');
            }
        };
    </script>
</body>
</html>
